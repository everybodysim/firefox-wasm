name: Deploy Firefox WASM to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download the prebuilt Firefox WASM demo
        run: |
          set -e
          mkdir -p site
          curl -fL --retry 5 --retry-delay 3 \
            "https://github.com/HeyPuter/firefox-wasm/releases/download/v0.0.1/chrome-demo-v0.0.1.tar.gz" \
            -o /tmp/firefox.tar.gz
          tar -xzf /tmp/firefox.tar.gz -C site --strip-components=1
          test -f site/index.html
          test -f site/gecko.wasm.zst || test -f site/gecko.wasm
          test -f site/chrome-assets.tar.zst
          test -f site/chrome-assets.json

      - name: Make the release GitHub-Pages compatible
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("site/index.html")
          s = p.read_text()

          # The v0.0.1 Puter-branded bundle discovers its Wisp endpoint by
          # fetching sensible-ship-8305.puter.work/. That discovery works on
          # the Puter-hosted demo but is unreliable from this static Pages
          # deployment. Return a known Wisp-compatible public endpoint instead.
          patch = r'''<script>
          (() => {
            const realFetch = window.fetch.bind(window);
            window.fetch = (input, init) => {
              let url = "";
              try { url = typeof input === "string" ? input : input.url; } catch {}
              if (url === "https://sensible-ship-8305.puter.work/" ||
                  url === "https://sensible-ship-8305.puter.work") {
                return Promise.resolve(new Response("wss://wisp.mercurywork.shop/", {
                  status: 200,
                  headers: {"Content-Type": "text/plain"}
                }));
              }
              return realFetch(input, init);
            };
          })();
          </script>
          '''
          marker = '<script type="module"'
          if 'PAGES_WISP_FALLBACK' not in s:
              patch = patch.replace('<script>', '<script>/* PAGES_WISP_FALLBACK */', 1)
              s = s.replace(marker, patch + marker, 1)
          p.write_text(s)
          PY

      - name: Add the cross-origin-isolation service worker
        run: |
          cat > site/coi-serviceworker.js <<'EOF'
          (() => {
            if (typeof window !== "undefined") {
              if (!("serviceWorker" in navigator)) return;
              navigator.serviceWorker.register("./coi-serviceworker.js", {
                scope: "./",
                updateViaCache: "none"
              }).then((registration) => {
                if (navigator.serviceWorker.controller) return;
                const reload = () => window.location.reload();
                if (registration.active) reload();
                else if (registration.installing) {
                  registration.installing.addEventListener("statechange", (e) => {
                    if (e.target.state === "activated") reload();
                  });
                }
              }).catch(console.error);
              return;
            }

            self.addEventListener("install", () => self.skipWaiting());
            self.addEventListener("activate", (event) => event.waitUntil(self.clients.claim()));
            self.addEventListener("fetch", (event) => {
              event.respondWith((async () => {
                const response = await fetch(event.request);
                const headers = new Headers(response.headers);
                headers.set("Cross-Origin-Opener-Policy", "same-origin");
                headers.set("Cross-Origin-Embedder-Policy", "require-corp");
                headers.set("Cross-Origin-Resource-Policy", "same-origin");
                return new Response(response.body, {
                  status: response.status,
                  statusText: response.statusText,
                  headers
                });
              })());
            });
          })();
          EOF

      - name: Add a Pages fallback
        run: cp site/index.html site/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
