name: Deploy Firefox WASM to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download the prebuilt Firefox WASM demo
        run: |
          set -e
          mkdir -p site
          curl -fL --retry 5 --retry-delay 3 \
            "https://github.com/HeyPuter/firefox-wasm/releases/download/v0.0.1/chrome-demo-v0.0.1.tar.gz" \
            -o /tmp/firefox.tar.gz
          tar -xzf /tmp/firefox.tar.gz -C site --strip-components=1
          test -f site/index.html
          test -f site/gecko.wasm.zst || test -f site/gecko.wasm
          test -f site/chrome-assets.tar.zst
          test -f site/chrome-assets.json

      - name: Configure WISP for GitHub Pages
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("site")
          pattern = re.compile(r'https://[^"\'\\\s]+\.puter\.work/')
          matches = []

          for p in root.rglob("*"):
              if not p.is_file() or p.name == "wisp.txt":
                  continue
              try:
                  s = p.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              found = pattern.findall(s)
              if found:
                  matches.extend((p, x) for x in found)
                  p.write_text(pattern.sub("./wisp.txt", s), encoding="utf-8")

          if not matches:
              raise SystemExit("ERROR: no *.puter.work WISP endpoint was found in the prebuilt release.")

          for p, x in matches:
              print(f"WISP endpoint patched in {p}: {x} -> ./wisp.txt")

          Path("site/wisp.txt").write_text("wss://wisp.mercurywork.shop/\n")
          print("WISP endpoint: wss://wisp.mercurywork.shop/")
          PY

      - name: Make the release GitHub-Pages compatible
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("site/index.html")
          s = p.read_text()

          marker = '<script type="module"'
          if 'coi-serviceworker.js' not in s:
              s = s.replace(
                  marker,
                  '<script src="./coi-serviceworker.js"></script>\n    ' + marker,
                  1,
              )

          s = re.sub(r'\s*<link rel="preconnect" href="https://fonts\.googleapis\.com"[^>]*>', '', s)
          s = re.sub(r'\s*<link rel="preconnect" href="https://fonts\.gstatic\.com"[^>]*>', '', s)
          s = re.sub(r'\s*<link\s+href="https://fonts\.googleapis\.com/css2\?[^"]*"[^>]*>', '', s)

          p.write_text(s)
          PY

      - name: Add build number and force GPU and disable experimental Wasm JIT
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          p = Path("site/index.html")
          s = p.read_text()
          n = os.environ["BUILD_NUMBER"]

          # Force GPU rendering while deliberately disabling the experimental Wasm JIT. The upstream project documents that its JIT is not usable on many websites; YouTube is one of the sites where we want the normal interpreter path.
          # The release stores these options in localStorage; stale software-mode
          # settings can make media/canvas-heavy sites painfully slow.
          startup = """<script>\ntry {\n  const k = "chrome-demo-opts";\n  const o = JSON.parse(localStorage.getItem(k) || "{}");\n  o.gpu = true;\n  o.jit = false;\n  localStorage.setItem(k, JSON.stringify(o));\n} catch (_) {}\n</script>\n"""
          head_before_module = s.split('<script type="module"', 1)[0]
          if "chrome-demo-opts" not in head_before_module:
              s = s.replace("</head>", startup + "</head>", 1)

          s = re.sub(r'<title>.*?</title>', f'<title>Firefox in WebAssembly — Build #{n}</title>', s, count=1, flags=re.S)

          # Do not monkey-patch requestAnimationFrame globally.
          # Firefox's own paint loop already throttles GPU mode, and replacing
          # RAF affects the embedded browser UI and every website it loads.
          p.write_text(s)
          PY

      - name: Make site navigation non-blocking in the embedded Firefox UI
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path

          patched = 0
          needle = 'async load(e){await this.run({op:L,url:e})}'
          replacement = r'''async load(e){if(this.opts.env?.GECKO_CHROME&&!/^(?:chrome:|about:)/.test(e)){const A=JSON.stringify(e);await this.run({op:te,url:"setTimeout(function(){try{var t=gBrowser.addTab("+A+",{triggeringPrincipal:Services.scriptSecurityManager.getSystemPrincipal(),forceNotRemote:true,inBackground:false});gBrowser.selectedTab=t}catch(e){console.error('embed load error',e)}},0)"});return}await this.run({op:L,url:e})}'''

          for p in Path("site").rglob("*.js"):
              try:
                  s = p.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              if needle in s:
                  s2 = s.replace(needle, replacement, 1)
                  p.write_text(s2, encoding="utf-8")
                  patched += 1
                  print(f"Patched non-blocking navigation in {p}")

          if patched != 1:
              raise SystemExit(f"ERROR: expected exactly 1 bundled Gecko JS file to patch, found {patched}")
          PY

      - name: Restore KeyboardEvent.code for web games
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import json

          p = Path("site/index.html")
          s = p.read_text(encoding="utf-8")

          # The prebuilt Gecko input bridge leaves KeyboardEvent.code unknown.
          # Many games use code for physical controls such as WASD and arrows.
          # Install a small privileged frame script instead of rebuilding the huge
          # Gecko WASM binary.
          frame_source = "(() => {\n  try {\n    const win = content.wrappedJSObject;\n    const proto = win.KeyboardEvent && win.KeyboardEvent.prototype;\n    if (!proto || proto.__firefoxWasmCodeFix) return;\n    const old = Object.getOwnPropertyDescriptor(proto, \"code\");\n    if (!old || typeof old.get !== \"function\") return;\n\n    const map = (e) => {\n      const k = e.key;\n      const loc = e.location;\n      if (k === \"ArrowUp\" || k === \"ArrowDown\" || k === \"ArrowLeft\" || k === \"ArrowRight\") return k;\n      if (k === \" \" || k === \"Spacebar\") return \"Space\";\n      if (k === \"Enter\") return \"Enter\";\n      if (k === \"Escape\" || k === \"Esc\") return \"Escape\";\n      if (k === \"Tab\") return \"Tab\";\n      if (k === \"Backspace\") return \"Backspace\";\n      if (k === \"Delete\") return \"Delete\";\n      if (k === \"Insert\") return \"Insert\";\n      if (k === \"Home\" || k === \"End\" || k === \"PageUp\" || k === \"PageDown\") return k;\n      if (k === \"Shift\") return loc === 2 ? \"ShiftRight\" : \"ShiftLeft\";\n      if (k === \"Control\") return loc === 2 ? \"ControlRight\" : \"ControlLeft\";\n      if (k === \"Alt\") return loc === 2 ? \"AltRight\" : \"AltLeft\";\n      if (k === \"Meta\") return loc === 2 ? \"MetaRight\" : \"MetaLeft\";\n      if (/^[a-zA-Z]$/.test(k)) return \"Key\" + k.toUpperCase();\n      if (/^[0-9]$/.test(k)) return \"Digit\" + k;\n      if (/^F([1-9]|1[0-2])$/.test(k)) return k;\n      const punctuation = {\n        \"-\": \"Minus\", \"_\": \"Minus\", \"=\": \"Equal\", \"+\": \"Equal\",\n        \"[\": \"BracketLeft\", \"{\": \"BracketLeft\",\n        \"]\": \"BracketRight\", \"}\": \"BracketRight\",\n        \"\\\\\": \"Backslash\", \"|\": \"Backslash\",\n        \";\": \"Semicolon\", \":\": \"Semicolon\",\n        \"'\": \"Quote\", \"\\\"\": \"Quote\",\n        \"`\": \"Backquote\", \"~\": \"Backquote\",\n        \",\": \"Comma\", \"<\": \"Comma\",\n        \".\": \"Period\", \">\": \"Period\",\n        \"/\": \"Slash\", \"?\": \"Slash\"\n      };\n      return punctuation[k] || \"\";\n    };\n\n    Object.defineProperty(proto, \"code\", {\n      configurable: true,\n      enumerable: old.enumerable,\n      get() {\n        let v = \"\";\n        try { v = old.get.call(this) || \"\"; } catch (_) {}\n        return v && v !== \"Unidentified\" ? v : (map(this) || v);\n      }\n    });\n    Object.defineProperty(proto, \"__firefoxWasmCodeFix\", {\n      value: true,\n      configurable: false,\n      enumerable: false\n    });\n  } catch (_) {}\n})()"
          snippet = "<script>\n(() => {\n  const frameSource = \"(() => {\\n  try {\\n    const win = content.wrappedJSObject;\\n    const proto = win.KeyboardEvent && win.KeyboardEvent.prototype;\\n    if (!proto || proto.__firefoxWasmCodeFix) return;\\n    const old = Object.getOwnPropertyDescriptor(proto, \\\"code\\\");\\n    if (!old || typeof old.get !== \\\"function\\\") return;\\n\\n    const map = (e) => {\\n      const k = e.key;\\n      const loc = e.location;\\n      if (k === \\\"ArrowUp\\\" || k === \\\"ArrowDown\\\" || k === \\\"ArrowLeft\\\" || k === \\\"ArrowRight\\\") return k;\\n      if (k === \\\" \\\" || k === \\\"Spacebar\\\") return \\\"Space\\\";\\n      if (k === \\\"Enter\\\") return \\\"Enter\\\";\\n      if (k === \\\"Escape\\\" || k === \\\"Esc\\\") return \\\"Escape\\\";\\n      if (k === \\\"Tab\\\") return \\\"Tab\\\";\\n      if (k === \\\"Backspace\\\") return \\\"Backspace\\\";\\n      if (k === \\\"Delete\\\") return \\\"Delete\\\";\\n      if (k === \\\"Insert\\\") return \\\"Insert\\\";\\n      if (k === \\\"Home\\\" || k === \\\"End\\\" || k === \\\"PageUp\\\" || k === \\\"PageDown\\\") return k;\\n      if (k === \\\"Shift\\\") return loc === 2 ? \\\"ShiftRight\\\" : \\\"ShiftLeft\\\";\\n      if (k === \\\"Control\\\") return loc === 2 ? \\\"ControlRight\\\" : \\\"ControlLeft\\\";\\n      if (k === \\\"Alt\\\") return loc === 2 ? \\\"AltRight\\\" : \\\"AltLeft\\\";\\n      if (k === \\\"Meta\\\") return loc === 2 ? \\\"MetaRight\\\" : \\\"MetaLeft\\\";\\n      if (/^[a-zA-Z]$/.test(k)) return \\\"Key\\\" + k.toUpperCase();\\n      if (/^[0-9]$/.test(k)) return \\\"Digit\\\" + k;\\n      if (/^F([1-9]|1[0-2])$/.test(k)) return k;\\n      const punctuation = {\\n        \\\"-\\\": \\\"Minus\\\", \\\"_\\\": \\\"Minus\\\", \\\"=\\\": \\\"Equal\\\", \\\"+\\\": \\\"Equal\\\",\\n        \\\"[\\\": \\\"BracketLeft\\\", \\\"{\\\": \\\"BracketLeft\\\",\\n        \\\"]\\\": \\\"BracketRight\\\", \\\"}\\\": \\\"BracketRight\\\",\\n        \\\"\\\\\\\\\\\": \\\"Backslash\\\", \\\"|\\\": \\\"Backslash\\\",\\n        \\\";\\\": \\\"Semicolon\\\", \\\":\\\": \\\"Semicolon\\\",\\n        \\\"'\\\": \\\"Quote\\\", \\\"\\\\\\\"\\\": \\\"Quote\\\",\\n        \\\"`\\\": \\\"Backquote\\\", \\\"~\\\": \\\"Backquote\\\",\\n        \\\",\\\": \\\"Comma\\\", \\\"<\\\": \\\"Comma\\\",\\n        \\\".\\\": \\\"Period\\\", \\\">\\\": \\\"Period\\\",\\n        \\\"/\\\": \\\"Slash\\\", \\\"?\\\": \\\"Slash\\\"\\n      };\\n      return punctuation[k] || \\\"\\\";\\n    };\\n\\n    Object.defineProperty(proto, \\\"code\\\", {\\n      configurable: true,\\n      enumerable: old.enumerable,\\n      get() {\\n        let v = \\\"\\\";\\n        try { v = old.get.call(this) || \\\"\\\"; } catch (_) {}\\n        return v && v !== \\\"Unidentified\\\" ? v : (map(this) || v);\\n      }\\n    });\\n    Object.defineProperty(proto, \\\"__firefoxWasmCodeFix\\\", {\\n      value: true,\\n      configurable: false,\\n      enumerable: false\\n    });\\n  } catch (_) {}\\n})()\";\n  const install = async () => {\n    if (!window.geckoEvalChrome) return;\n    try {\n      const result = await window.geckoEvalChrome(\n        \"(() => { try { Services.mm.loadFrameScript(\" +\n        JSON.stringify(\"data:text/javascript;charset=utf-8,\") +\n        \" + encodeURIComponent(\" + JSON.stringify(frameSource) + \"), true); return 'keyboard-code-fix-installed'; } \" +\n        \"catch (e) { return 'keyboard-code-fix-error:' + e; } })()\"\n      );\n      if (result) {\n        console.log(\"[keyboard] \" + result);\n        clearInterval(timer);\n      }\n    } catch (_) {}\n  };\n  const timer = setInterval(() => void install(), 250);\n  void install();\n})();\n</script>\n"
          if "keyboard-code-fix-installed" not in s:
              s = s.replace("</body>", snippet + "</body>", 1)
          p.write_text(s, encoding="utf-8")
          PY

      - name: Add the cross-origin-isolation service worker
        run: |
          cat > site/coi-serviceworker.js <<'EOF'
          (() => {
            if (typeof window !== "undefined") {
              if (!("serviceWorker" in navigator)) return;
              navigator.serviceWorker.register("./coi-serviceworker.js", {
                scope: "./",
                updateViaCache: "none"
              }).then((registration) => {
                if (navigator.serviceWorker.controller) return;
                const reload = () => window.location.reload();
                if (registration.active) reload();
                else if (registration.installing) {
                  registration.installing.addEventListener("statechange", (e) => {
                    if (e.target.state === "activated") reload();
                  });
                }
              }).catch(console.error);
              return;
            }

            self.addEventListener("install", () => self.skipWaiting());
            self.addEventListener("activate", (event) => event.waitUntil(self.clients.claim()));
            self.addEventListener("fetch", (event) => {
              event.respondWith((async () => {
                const response = await fetch(event.request);
                const headers = new Headers(response.headers);
                headers.set("Cross-Origin-Opener-Policy", "same-origin");
                headers.set("Cross-Origin-Embedder-Policy", "require-corp");
                headers.set("Cross-Origin-Resource-Policy", "same-origin");
                return new Response(response.body, {
                  status: response.status,
                  statusText: response.statusText,
                  headers
                });
              })());
            });
          })();
          EOF

      - name: Add a Pages fallback
        run: cp site/index.html site/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
