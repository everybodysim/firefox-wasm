name: Deploy Firefox WASM to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download the prebuilt Firefox WASM demo
        run: |
          set -e
          mkdir -p site
          curl -fL --retry 5 --retry-delay 3 \
            "https://github.com/HeyPuter/firefox-wasm/releases/download/v0.0.1/chrome-demo-v0.0.1.tar.gz" \
            -o /tmp/firefox.tar.gz
          tar -xzf /tmp/firefox.tar.gz -C site --strip-components=1
          test -f site/index.html
          test -f site/gecko.wasm.zst || test -f site/gecko.wasm
          test -f site/chrome-assets.tar.zst
          test -f site/chrome-assets.json

      - name: Configure WISP for GitHub Pages
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("site")
          pattern = re.compile(r'https://[^"\'\\\s]+\.puter\.work/')
          matches = []

          for p in root.rglob("*"):
              if not p.is_file() or p.name == "wisp.txt":
                  continue
              try:
                  s = p.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              found = pattern.findall(s)
              if found:
                  matches.extend((p, x) for x in found)
                  p.write_text(pattern.sub("./wisp.txt", s), encoding="utf-8")

          if not matches:
              raise SystemExit("ERROR: no *.puter.work WISP endpoint was found in the prebuilt release.")

          for p, x in matches:
              print(f"WISP endpoint patched in {p}: {x} -> ./wisp.txt")

          Path("site/wisp.txt").write_text("wss://wisp.mercurywork.shop/\n")
          print("WISP endpoint: wss://wisp.mercurywork.shop/")
          PY

      - name: Make the release GitHub-Pages compatible
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("site/index.html")
          s = p.read_text()

          marker = '<script type="module"'
          if 'coi-serviceworker.js' not in s:
              s = s.replace(
                  marker,
                  '<script src="./coi-serviceworker.js"></script>\n    ' + marker,
                  1,
              )

          s = re.sub(r'\s*<link rel="preconnect" href="https://fonts\.googleapis\.com"[^>]*>', '', s)
          s = re.sub(r'\s*<link rel="preconnect" href="https://fonts\.gstatic\.com"[^>]*>', '', s)
          s = re.sub(r'\s*<link\s+href="https://fonts\.googleapis\.com/css2\?[^"]*"[^>]*>', '', s)

          p.write_text(s)
          PY

      - name: Add build number and force GPU/Wasm JIT
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          p = Path("site/index.html")
          s = p.read_text()
          n = os.environ["BUILD_NUMBER"]

          # Force the full rendering/JIT configuration for this deployment.
          # The release stores these options in localStorage; stale software-mode
          # settings can make media/canvas-heavy sites painfully slow.
          startup = """<script>\ntry {\n  const k = "chrome-demo-opts";\n  const o = JSON.parse(localStorage.getItem(k) || "{}");\n  o.gpu = true;\n  o.jit = true;\n  localStorage.setItem(k, JSON.stringify(o));\n} catch (_) {}\n</script>\n"""
          head_before_module = s.split('<script type="module"', 1)[0]
          if "chrome-demo-opts" not in head_before_module:
              s = s.replace("</head>", startup + "</head>", 1)

          s = re.sub(r'<title>.*?</title>', f'<title>Firefox in WebAssembly — Build #{n}</title>', s, count=1, flags=re.S)

          # Do not monkey-patch requestAnimationFrame globally.
          # Firefox's own paint loop already throttles GPU mode, and replacing
          # RAF affects the embedded browser UI and every website it loads.
          p.write_text(s)
          PY

      - name: Make site navigation non-blocking in the embedded Firefox UI
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path

          patched = 0
          needle = 'async load(e){await this.run({op:L,url:e})}'
          replacement = r'''async load(e){if(this.opts.env?.GECKO_CHROME&&!/^(?:chrome:|about:)/.test(e)){const A=JSON.stringify(e);await this.run({op:te,url:"setTimeout(function(){try{var t=gBrowser.addTab("+A+",{triggeringPrincipal:Services.scriptSecurityManager.getSystemPrincipal(),forceNotRemote:true,inBackground:false});gBrowser.selectedTab=t}catch(e){console.error('embed load error',e)}},0)"});return}await this.run({op:L,url:e})}'''

          for p in Path("site").rglob("*.js"):
              try:
                  s = p.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              if needle in s:
                  s2 = s.replace(needle, replacement, 1)
                  p.write_text(s2, encoding="utf-8")
                  patched += 1
                  print(f"Patched non-blocking navigation in {p}")

          if patched != 1:
              raise SystemExit(f"ERROR: expected exactly 1 bundled Gecko JS file to patch, found {patched}")
          PY

      - name: Add the cross-origin-isolation service worker
        run: |
          cat > site/coi-serviceworker.js <<'EOF'
          (() => {
            if (typeof window !== "undefined") {
              if (!("serviceWorker" in navigator)) return;
              navigator.serviceWorker.register("./coi-serviceworker.js", {
                scope: "./",
                updateViaCache: "none"
              }).then((registration) => {
                if (navigator.serviceWorker.controller) return;
                const reload = () => window.location.reload();
                if (registration.active) reload();
                else if (registration.installing) {
                  registration.installing.addEventListener("statechange", (e) => {
                    if (e.target.state === "activated") reload();
                  });
                }
              }).catch(console.error);
              return;
            }

            self.addEventListener("install", () => self.skipWaiting());
            self.addEventListener("activate", (event) => event.waitUntil(self.clients.claim()));
            self.addEventListener("fetch", (event) => {
              event.respondWith((async () => {
                const response = await fetch(event.request);
                const headers = new Headers(response.headers);
                headers.set("Cross-Origin-Opener-Policy", "same-origin");
                headers.set("Cross-Origin-Embedder-Policy", "require-corp");
                headers.set("Cross-Origin-Resource-Policy", "same-origin");
                return new Response(response.body, {
                  status: response.status,
                  statusText: response.statusText,
                  headers
                });
              })());
            });
          })();
          EOF

      - name: Add a Pages fallback
        run: cp site/index.html site/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
